[package]
name = "animato-wasm"
version.workspace = true
edition = "2021"
publish = false
description = "The WebAssembly module the Animato editor loads: timecode, SRT, waveform, captions, MP4 demuxing, the frame renderer (compositor + Vello graphics), the audio mixer."

[lib]
crate-type = ["cdylib", "rlib"]

