serde_json.workspace = true
serde-wasm-bindgen.workspace = true
offcut-mp4.workspace = true
offcut-wasm-core.workspace = true
tooscut-compositor.workspace = true
animato-graphics.workspace = true
animato-overlay.workspace = true
wgpu.workspace = true
tooscut-audio-engine.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
console_error_panic_hook.workspace = true
