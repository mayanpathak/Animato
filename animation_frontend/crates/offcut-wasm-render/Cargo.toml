[package]
name = "offcut-wasm-render"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# A WebAssembly module for the browser. scripts/build-wasm.sh builds it.
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
offcut-types = { workspace = true }
offcut-render = { workspace = true }
offcut-detect = { workspace = true }
offcut-mp4 = { workspace = true }
offcut-entitlement = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
# The synchronous OPFS handle the demuxer reads through, the canvas a frame
# is drawn to, and the decoded frame that is drawn.
web-sys = { workspace = true, features = [
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
    "OffscreenCanvas",
    "VideoFrame",
] }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
