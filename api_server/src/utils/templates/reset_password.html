<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial, Helvetica, sans-serif; color:#333333;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:8px; padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 16px; font-size:22px; color:#111111;">Reset your password</h1>
                <p style="margin:0 0 24px; font-size:15px; line-height:22px;">
                  We received a request to reset your password. Click the button below to choose a new one:
                </p>
                <p style="margin:0 0 24px; text-align:center;">
                  <a href="{{RESET_URL}}" style="display:inline-block; padding:12px 24px; background-color:#2563eb; color:#ffffff; text-decoration:none; border-radius:6px; font-size:15px; font-weight:bold;">Reset password</a>
                </p>
                <p style="margin:0 0 16px; font-size:15px; line-height:22px;">
                  This link expires in 1 hour.
                </p>
                <p style="margin:0; font-size:13px; line-height:20px; color:#777777;">
                  If you did not request a password reset, you can ignore this email. Your password will not change.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
