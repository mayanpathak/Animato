<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify your email</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial, Helvetica, sans-serif; color:#333333;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:8px; padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 16px; font-size:22px; color:#111111;">Verify your email</h1>
                <p style="margin:0 0 24px; font-size:15px; line-height:22px;">
                  Thanks for signing up. Enter this code to verify your email address:
                </p>
                <p style="margin:0 0 24px; text-align:center; font-size:32px; font-weight:bold; letter-spacing:8px; color:#111111;">
                  {{CODE}}
                </p>
                <p style="margin:0 0 16px; font-size:15px; line-height:22px;">
                  This code expires in 15 minutes.
                </p>
                <p style="margin:0; font-size:13px; line-height:20px; color:#777777;">
                  If you did not create an account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
